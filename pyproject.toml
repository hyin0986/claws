[build-system]
requires = ["setuptools[core]", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]


[project]
name = "claws"
authors = [{ name = "claws", email = "/dev/null@belle2.org" }]
license = { file = "LICENSE" }
# classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version"]
dependencies = []


[tool.setuptools]
package-dir = {"" = "src", "abort_trigger_daq_rpty_stmlb125_14" = "external/kek-abort-daq/firmware/python/abort_trigger_daq_rpty_stmlb125_14", "axi_soc_7000_core" = "external/kek-abort-daq/firmware/submodules/axi-soc-7000-core/python/axi_soc_7000_core"}
packages = ["claws", "abort_trigger_daq_rpty_stmlb125_14", "axi_soc_7000_core"]


[project.scripts]
claws_server="claws.scripts.zmq_server:main"
claws_pydm="claws.scripts.pydm_gui:main"


[tool.setuptools.package-data]
"claws.resources.xmls" = ["*.xml"]


[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-rerunfailures",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-design",
    "numpydoc",
    "sphinx_rtd_theme",
    "sphinxcontrib-mermaid",
    "ruff",
    "build",
    "scipy-stubs",
]

[tool.ruff]
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv"]
line-length = 79
indent-width = 4

[tool.ruff.lint]
fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
exclude = [".venv", "test", "doc", "check", "data", "hw_test", "public"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["epics.*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--cov=svd_picoscope"
